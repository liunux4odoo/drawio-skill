  listEl.addEventListener('click', function (e) {
    // 点击卡片本体（非按钮）→ 选中该批注，手动修改面板跟随更新
    var cardEl = e.target.closest('.card');
    var actionEl = e.target.closest('[data-act]');

    if (actionEl) {
      var act = actionEl.getAttribute('data-act');
      var id = actionEl.getAttribute('data-id');

      if (act === 'del') {
        removeAnnotation(id);
        return;
      }

      if (act === 'focus') {
        var ann = findAnn(id);
        if (!ann) { return; }
        var da = getDA();
        if (da && da.focus) {
          var ok = false;
          try { ok = da.focus(ann.selector); } catch (err) { ok = false; }
          if (ok) { status('已定位：' + ann.selector); flashCard(id); }
          else { status('在页面上找不到该元素（页面可能已改变）：' + ann.selector, 'warn'); }
        } else {
          status('无法定位：页面不可访问（跨域）', 'warn');
        }
        return;
      }

      if (act === 'write-src') {
        writeSource(findAnn(id));
        return;
      }

      if (act === 'delete-el') {
        deleteElement(findAnn(id));
        return;
      }

      return;
    }

    // 手动模式的批注选择项
    var mpItem = e.target.closest('[data-mpid]');
    if (mpItem) {
      var mid = mpItem.getAttribute('data-mpid');
      state.selectedId = (state.selectedId === mid) ? null : mid;
      render();
      renderManualPanel();
      return;
    }

    if (cardEl) {
      var cid = cardEl.getAttribute('data-id');
      state.selectedId = (state.selectedId === cid) ? null : cid;
      render();
      renderManualPanel();
      return;
    }
  });

  listEl.addEventListener('input', function (e) {
    var el = e.target;
    var act = el.getAttribute && el.getAttribute('data-act');
    var id = el.getAttribute && el.getAttribute('data-id');

    if (!act || !id) { return; }
    var ann = findAnn(id);
    if (!ann) { return; }

    if (act === 'text') {
      ann.text = el.value;
      save();
    }
  });

  // 手动修改面板：结构化控件 → liveEdits；写源/删除按钮
  var mpBody = document.getElementById('mp-body');
  mpBody.addEventListener('input', function (e) {
    var el = e.target;
    var q = el.getAttribute && el.getAttribute('data-q');
    var id = el.getAttribute && el.getAttribute('data-id');
    if (!q || !id) { return; }
    var ann = findAnn(id);
    if (!ann) { return; }
    handleManualInput(ann, q, el.value);
  });
  mpBody.addEventListener('change', function (e) {
    var el = e.target;
    var q = el.getAttribute && el.getAttribute('data-q');
    var id = el.getAttribute && el.getAttribute('data-id');
    if (!q || !id) { return; }
    var ann = findAnn(id);
    if (!ann) { return; }
    if (q === 'bold' || q === 'italic' || q === 'underline') {
      handleManualInput(ann, q, el.checked);
    }
  });
  mpBody.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) { return; }
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');
    if (act === 'write-src') { writeSource(findAnn(id)); return; }
    if (act === 'delete-el') { deleteElement(findAnn(id)); return; }
  });

  document.getElementById('btn-clear').addEventListener('click', function () {
    var total = totalAnnotations();
    if (!total) { status('当前没有批注'); return; }
    var pages = annotatedPages();
    var msg = pages.length > 1
      ? '清空全部 ' + total + ' 条批注（涉及 ' + pages.length + ' 个页面）？'
      : '清空当前全部 ' + total + ' 条批注？';
    if (!window.confirm(msg)) { return; }
    state.byPage = {};
    mountPage(state.page);
    var da = getDA();
    if (da && da.clear) { try { da.clear(); } catch (e) { /* ignore */ } }
    render();
    save();
    status('已清空');
  });

  /* ---------- 导出 ---------- */

  function annotationOut(a, page) {
    var o = {
      id: a.id,
      page: page,
      selector: a.selector,
      xpath: a.xpath,
      tagName: a.tagName,
      rect: a.rect,
      computedStyle: a.computedStyle,
      textSnippet: a.textSnippet,
      htmlSnippet: a.htmlSnippet,
      text: a.text || ''
    };
    if (a.stale) { o.stale = true; }

    var sc = {};
    var css = {};

    var le = a.liveEdits || {};
    Object.keys(le.style || {}).forEach(function (p) {
      css[p] = le.style[p].value + (le.style[p].important ? ' !important' : '');
    });
    if (Object.keys(css).length) { sc.css = css; }
    if (le.attr && Object.keys(le.attr).length) { sc.attributes = le.attr; }
    if (le.text != null) { sc.innerHTML = escapeHtml(le.text); }
    if (a.liveDelete || a.deleted) { sc.delete = true; }
    if (Object.keys(sc).length) { o.suggestedChanges = sc; }
    if (a.applied) { o.appliedToSource = true; }

    return o;
  }

  function buildFeedback() {
    var vp = viewportInfo();
    var pages = annotatedPages();
    var all = [];
    pages.forEach(function (p) {
      state.byPage[p].forEach(function (a) { all.push(annotationOut(a, p)); });
    });
    return {
      schemaVersion: 'dom-feedback-1',
      source: state.source,
      sourceType: state.sourceType || 'file',
      timestamp: new Date().toISOString(),
      viewport: vp,
      pages: pages,
      annotations: all
    };
  }

  function downloadText(text, filename, mime) {
    var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        ta.remove();
        ok ? resolve() : reject(new Error('execCommand copy failed'));
      } catch (err) { reject(err); }
    });
  }

  document.getElementById('btn-export').addEventListener('click', function () {
    if (!state.source) { status('请先加载一个 HTML 页面', 'warn'); return; }
    var total = totalAnnotations();
    if (!total) { status('还没有批注可以导出', 'warn'); return; }
    downloadText(JSON.stringify(buildFeedback(), null, 2), 'annotations.json', 'application/json;charset=utf-8');
    status('已导出 ' + total + ' 条批注 / ' + annotatedPages().length + ' 个页面 —— 放到工作区 .dom-annotator/ 目录下，再让 agent 按标注改', 'ok');
  });

  document.getElementById('btn-copy').addEventListener('click', function () {
    if (!totalAnnotations()) { status('还没有批注可以复制', 'warn'); return; }
    copyText(JSON.stringify(buildFeedback(), null, 2))
      .then(function () { status('JSON 已复制到剪贴板', 'ok'); })
      .catch(function () { status('复制失败，请改用「导出 JSON」', 'warn'); });
  });

  function toMarkdown() {
    var fb = buildFeedback();
    var lines = [];
    var idx = 0;

    lines.push('## DOM 标注反馈');
    lines.push('');
    lines.push('- 来源：`' + (fb.source || '(未命名)') + '`（' + fb.sourceType + '）');
    lines.push('- 时间：' + fb.timestamp);
    lines.push('- 视口：' + fb.viewport.width + '×' + fb.viewport.height + ' @' + fb.viewport.devicePixelRatio + 'x');
    lines.push('- 批注数：' + fb.annotations.length +
      (fb.pages.length > 1 ? '（分布在 ' + fb.pages.length + ' 个页面）' : ''));
    lines.push('');

    fb.pages.forEach(function (p) {
      var items = fb.annotations.filter(function (a) { return a.page === p; });
      if (!items.length) { return; }

      if (fb.pages.length > 1) {
        lines.push('### 文件：`' + p + '`');
        lines.push('');
      }

      items.forEach(function (a) {
        idx += 1;
        lines.push('#### ' + idx + '. `' + a.selector + '`');
        lines.push('');
        lines.push('- 目标文件：`' + p + '`');
        lines.push('- 元素：`<' + a.tagName + '>`' + (a.textSnippet ? ' 文本：「' + a.textSnippet + '」' : ''));
        lines.push('- 修改意见：' + (a.text ? a.text : '(未填写)'));
        if (a.rect) {
          lines.push('- 位置：x=' + a.rect.x + ' y=' + a.rect.y + ' 宽=' + a.rect.width + ' 高=' + a.rect.height);
        }
        if (a.computedStyle) {
          var keep = ['display', 'position', 'color', 'background-color', 'font-size', 'font-weight', 'padding-top', 'padding-left', 'margin-top', 'margin-left', 'border-radius', 'width', 'height'];
          var pair = keep.filter(function (k) { return a.computedStyle[k]; })
            .map(function (k) { return k + ': ' + a.computedStyle[k]; });
          if (pair.length) { lines.push('- 当前样式：`' + pair.join('; ') + '`'); }
        }
        if (a.suggestedChanges) {
          var parts = [];
          if (a.suggestedChanges.css) {
            parts.push('CSS: ' + Object.keys(a.suggestedChanges.css).map(function (k) {
              return k + ': ' + a.suggestedChanges.css[k];
            }).join('; '));
          }
          if (a.suggestedChanges.attributes) {
            parts.push('属性: ' + Object.keys(a.suggestedChanges.attributes).map(function (k) {
              return k + '=' + a.suggestedChanges.attributes[k];
            }).join('; '));
          }
          if (a.suggestedChanges.innerHTML != null) { parts.push('内容: ' + a.suggestedChanges.innerHTML); }
          if (a.suggestedChanges.delete) { parts.push('删除元素'); }
          if (parts.length) { lines.push('- 结构化建议：' + parts.join(' | ')); }
        }
        if (a.xpath) { lines.push('- XPath：`' + a.xpath + '`'); }
        if (a.htmlSnippet) {
          lines.push('- 片段：');
          lines.push('');
          lines.push('```html');
          lines.push(a.htmlSnippet);
          lines.push('```');
        }
        lines.push('');
      });
    });

    return lines.join('\n');
  }

  document.getElementById('btn-copy-md').addEventListener('click', function () {
    if (!totalAnnotations()) { status('还没有批注可以复制', 'warn'); return; }
    copyText(toMarkdown())
      .then(function () { status('Markdown 已复制到剪贴板，可直接粘贴给 agent', 'ok'); })
      .catch(function () { status('复制失败', 'warn'); });
  });

  /* ---------- 接收目标页面消息 ---------- */

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.source !== '__DA__') { return; }
    if (d.type === 'select' && d.payload) { addAnnotation(d.payload); return; }
    if (d.type === 'navigate' && d.href) { handleNavigate(d.href); }
  });

  function resolveNavTarget(href) {
    if (!state.dirFiles) { return null; }
    var p = resolvePath(state.page, href);
    if (!p) { return null; }
    var candidates = [p];
    if (!/\.html?$/i.test(p)) {
      candidates.push(p + '.html', p + '.htm', p + '/index.html');
    }
    for (var i = 0; i < candidates.length; i++) {
      if (state.dirFiles[candidates[i]]) { return candidates[i]; }
    }
    return null;
  }

  function handleNavigate(href) {
    if (!state.dirFiles) {
      status('页面内链接跳转只在「打开文件夹」模式下支持（单文件 / URL 模式无法解析目标文件）', 'warn');
      return;
    }
    var target = resolveNavTarget(href);
    if (!target) {
      status('链接目标不在所选文件夹内，未跳转：' + href, 'warn');
      return;
    }
    if (target === state.page) { return; }
    loadEntry(target);
  }

  /* ---------- 启动 ---------- */

  document.getElementById('ver-chip').textContent = 'v' + VERSION;
  window.__DA_VERSION__ = VERSION;

  try {
    var savedVp = localStorage.getItem('dom-annotator:viewport');
    if (savedVp) { applyViewport(savedVp); }
  } catch (e) { /* ignore */ }

  var welcome = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">' +
    '<style>body{margin:0;padding:56px 32px;font:14px/1.8 system-ui,"Noto Sans CJK SC",sans-serif;color:#888;text-align:center;background:#fff}' +
    'h2{color:#444;font-size:18px;font-weight:600;margin:0 0 16px}p{margin:6px 0}' +
    'kbd{background:#eee;border:1px solid #ccc;border-bottom-width:2px;border-radius:3px;padding:0 5px;font-size:12px;color:#555}' +
    'code{background:#f4f4f4;padding:1px 5px;border-radius:3px;font-size:12px;color:#666}</style></head><body>' +
    '<h2>DOM Annotator</h2>' +
    '<p>推荐点「打开文件夹」——CSS / 图片 / 脚本会自动内联，多页面可直接点链接切换</p>' +
    '<p>也可以点「加载单个 HTML」，或在上方输入 URL 后回车</p>' +
    '<p>按住 <kbd>Ctrl</kbd>/<kbd>⌘</kbd> 点击元素添加批注，或打开「标注模式」直接点</p>' +
    '<p style="margin-top:20px;font-size:12px;color:#999">导出 JSON 放到工作区 <code>.dom-annotator/annotations.json</code>，再让 agent 按标注改</p>' +
    '</body></html>';

  setFrameHtml(welcome).then(function () { injectInspector(); render(); });

  // 目标页每次加载（服务模式下含站内跳转）后重新注入检查器
  frame.addEventListener('load', function () { onFrameLoad(); });

  // 若由 scripts/serve.py 托管，直接进入服务模式并装载目录
  detectServerMode().then(function (info) {
    if (info) { enterServerMode(info); return; }
    // 否则：若之前授权过目录，直接恢复（权限仍在时无需再点）
    probeLastFolder();
  });
})();
</script>
</body>
</html>
